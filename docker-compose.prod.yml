# Production stack — Postgres + API + Web + Caddy, on segmented private networks (see `networks:`).
# Only Caddy is published (80/443); everything else is reachable only by service
# name on its private network. Caddy terminates TLS and routes /api → api:8080,
# everything else → web:3000 (see Caddyfile) — one public origin, no browser CORS.
#
# Setup:  cp .env.prod.example .env  &&  edit .env  (secrets + DOMAIN)
# TLS:    Cloudflare Origin Certificate in ./certs (docs/DEPLOY.md § 2)
# Roles:  docker compose -f docker-compose.prod.yml --profile db-roles run --rm db-roles
# Schema: docker compose -f docker-compose.prod.yml --profile migrate run --rm --build migrate
# Up:     docker compose -f docker-compose.prod.yml up -d --build
# Seed:   docker compose -f docker-compose.prod.yml exec api node_modules/.bin/tsx src/db/seed-cli.ts
#
# Compose interpolation (${VAR}) reads the project-dir `.env`, the single source
# of truth for secrets; each service receives only the variables it lists.

name: scs-firearm

# Every container logs to the host's journald (story 12.7a): the logs outlive a
# recreated container (a deploy), and are searched with journalctl, e.g.
#   journalctl -t scs-firearm-api-1 -g '<reqId>' --since today
# Retention (14 days) is set host-side by infra/journald/scs-firearm.conf
# (docs/DEPLOY.md § Logs). `docker compose logs` keeps working.
x-logging: &logging
  driver: journald
  options:
    tag: "{{.Name}}" # the container name, e.g. scs-firearm-api-1

services:
  postgres:
    logging: *logging
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-armurier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-armurier_prod}
    volumes:
      # Postgres 18+ keeps its data in /var/lib/postgresql/<major>/docker: mount
      # the parent, so a later major upgrade (pg_upgrade --link) sees both.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-armurier} -d ${POSTGRES_DB:-armurier_prod}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    networks: [data]

  # Least-privilege database roles (story 12.9f, infra/postgres/roles.sql):
  # scs_owner (migrations), scs_app (API), scs_backup (pg_dump). Run once
  # before the first migration, then after any role password change:
  # `just db-roles`. Re-running it is safe. Connects as the superuser, which
  # nothing else uses.
  db-roles:
    logging: *logging
    image: postgres:18-alpine
    profiles: ["db-roles"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-armurier}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-armurier_prod}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:?set DB_BACKUP_PASSWORD in .env}
    volumes:
      - ./infra/postgres/roles.sql:/roles.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    # $$ keeps the variables for the container's shell, not compose.
    command:
      - sh
      - -c
      - >-
        psql -q -v db="$$PGDATABASE" -v owner_password="$$DB_OWNER_PASSWORD"
        -v app_password="$$DB_APP_PASSWORD" -v backup_password="$$DB_BACKUP_PASSWORD"
        -f /roles.sql
    networks: [data]

  # One-off schema migration (drizzle-kit lives in dev deps → use the build
  # stage, which has the full workspace and the `drizzle/` migration files).
  # Gated behind the `migrate` profile so it never runs on a normal `up`.
  # Applies the committed migrations in order and records them, so re-running is
  # a no-op and the deployed schema is always a known revision — no destructive
  # diffing against a live database.
  migrate:
    logging: *logging
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    profiles: ["migrate"]
    environment:
      # The schema owner, the only role allowed DDL (story 12.9f).
      DATABASE_URL: postgresql://scs_owner:${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-armurier_prod}
    depends_on:
      postgres:
        condition: service_healthy
    # The binary directly, not `pnpm --filter … exec`: pnpm 11 first re-checks
    # the install, finds the workspace touched by the Dockerfile's
    # `pnpm deploy --prod`, reinstalls it and then misses drizzle-kit (a dev
    # dependency). `just check-migrate` runs this path end to end.
    working_dir: /repo/apps/api
    command: ["node_modules/.bin/drizzle-kit", "migrate"]
    networks: [data]

  # One-off check of the WHOLE .env (story 12.9b): the API only receives its own
  # variables, so the Postgres, backup and Umami secrets are checked here for the
  # committed examples' sample values. Same image as the API, no network at all,
  # gated behind a profile; `just deploy` / `just update` run it first.
  env-check:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: scs-api:latest
    profiles: ["env-check"]
    env_file: [.env]
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    command: ["node_modules/.bin/tsx", "src/env-check-cli.ts"]

  api:
    logging: *logging
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: scs-api:latest
    restart: unless-stopped
    # An allowlist, not `env_file: [.env]`: the shared .env also holds the
    # Postgres superuser, schema-owner and backup secrets, which a code execution
    # in the API must not reach (audit 2026-11-15). A key with no value is read
    # from .env by name, and stays unset when .env lacks it, so env.ts defaults
    # apply. deploy-files.test.ts keeps this list equal to what the API reads.
    environment:
      # Wiring to the in-network services + production mode.
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8080
      # Rows only, no DDL (story 12.9f); the API refuses to start as a stronger role.
      DATABASE_URL: postgresql://scs_app:${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-armurier_prod}
      # Antivirus on uploaded legal docs (Story 8.6) — scan via the clamd sidecar.
      CLAMAV_ENABLED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      # Auth
      JWT_SECRET:
      JWT_REFRESH_SECRET:
      JWT_EXPIRES_IN:
      JWT_REFRESH_EXPIRES_IN:
      TOTP_ENCRYPTION_KEY:
      INTERNAL_API_SECRET:
      WEB_BASE_URL:
      # Storage
      STORAGE_DRIVER:
      S3_ENDPOINT:
      S3_ACCESS_KEY:
      S3_SECRET_KEY:
      S3_BUCKET:
      S3_REGION:
      S3_FORCE_PATH_STYLE:
      # E-mail and newsletter
      SMTP_HOST:
      SMTP_PORT:
      SMTP_USER:
      SMTP_PASS:
      SMTP_FROM:
      NEWSLETTER_DRIVER:
      BREVO_API_KEY:
      BREVO_LIST_ID_ARMURERIE:
      BREVO_LIST_ID_COLLECTION:
      BREVO_LIST_ID_GUN_ART:
      BREVO_WEBHOOK_SECRET:
      # Payments and invoicing
      STRIPE_SECRET_KEY:
      STRIPE_WEBHOOK_SECRET:
      VIREMENT_IBAN:
      VIREMENT_BIC:
      VIREMENT_BANK_NAME:
      VIREMENT_ACCOUNT_HOLDER:
      HENRRI_BASE_URL:
      HENRRI_CLIENT_ID:
      HENRRI_CLIENT_SECRET:
      HENRRI_WEBHOOK_SECRET:
      HENRRI_SYNC_INTERVAL_MINUTES:
      COMMISSION_RATE_PCT:
      DEFAULT_CHARGES_PCT:
      # Carriers
      LAPOSTE_OKAPI_KEY:
      MONDIAL_RELAY_ENSEIGNE:
      MONDIAL_RELAY_PRIVATE_KEY:
      TRACKING_POLL_INTERVAL_MINUTES:
      # Schedulers, features, observability
      SLA_CHECK_INTERVAL_MINUTES:
      ORDER_CONFIRMATION_RETRY_MINUTES:
      CROSS_SELL_ENABLED:
      LOG_LEVEL:
      ERROR_ALERT_COOLDOWN_MINUTES:
      ERROR_ALERTS_ENABLED:
      # Gun Art watermark
      ARTWORK_WATERMARK_TEXT:
      ARTWORK_WATERMARK_POSITION:
      ARTWORK_WATERMARK_OPACITY:
      ARTWORK_WATERMARK_SCALE:
      ARTWORK_PUBLIC_MAX_WIDTH:
      # Demo seed only (`just seed-demo`); never set on the live site.
      ADMIN_SEED_EMAIL:
      ADMIN_SEED_PASSWORD:
    depends_on:
      postgres:
        condition: service_healthy
      # Wait for the virus DB to finish loading: a document uploaded while clamd
      # is unavailable stays "pending" (unscannable) and would need a re-scan.
      clamav:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    networks: [edge, data, scan]

  # ClamAV daemon (clamd) — antivirus for uploaded legal documents (Story 8.6).
  # The API streams each upload here over TCP (INSTREAM) and gates the document's
  # usability on the verdict. Ships freshclam, which keeps the virus DB current.
  clamav:
    logging: *logging
    image: clamav/clamav:1.5.3
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav # virus DB — persist so restarts don't re-download
    healthcheck:
      # clamdcheck.sh PINGs the running daemon; unhealthy until the DB has loaded.
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 6
      # The first virus-DB download is often throttled on hosting IP ranges:
      # 10 minutes before `up -d` gives up on the API (audit 2026-11-15, B3).
      start_period: 600s
    security_opt: ["no-new-privileges:true"]
    networks: [scan]

  web:
    logging: *logging
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: scs-web:latest
    restart: unless-stopped
    # Nuxt runtimeConfig.public is overridable at runtime via NUXT_PUBLIC_*.
    # Single origin → the browser talks to the API at https://www.DOMAIN/api.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: https://www.${DOMAIN:?set DOMAIN in .env}/api
      NUXT_PUBLIC_SITE_URL: https://www.${DOMAIN}
      # Server-side calls stay on the private network instead of going back out
      # through Cloudflare, and carry the visitor's IP + the shared secret — else
      # every SSR render shares one rate-limit budget (story 9.6).
      NUXT_API_INTERNAL_BASE: http://api:8080/api
      NUXT_INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set INTERNAL_API_SECRET in .env}
      # Created in the Umami dashboard once (docs/DEPLOY.md § Umami). Empty = no
      # measurement; set, the tracker still waits for the visitor's consent.
      NUXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      # Search Console "HTML tag" token (docs/DEPLOY.md § Search Console).
      NUXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    depends_on:
      - api
    security_opt: ["no-new-privileges:true"]
    networks: [edge]

  # Audience measurement (story 9.6): self-hosted Umami, in its own database on
  # the same Postgres (one-time setup: docs/DEPLOY.md § Umami). Visitors only
  # reach its tracker and collect endpoint, through Caddy under /_a/; the
  # dashboard is served on stats.DOMAIN behind Umami's own login. The front
  # loads the tracker only after consent.
  # Pinned: 3.2.0 is the newest release past the 90-day dependency quarantine.
  umami:
    logging: *logging
    image: ghcr.io/umami-software/umami:3.2.0
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in .env}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in .env}
      # No phoning home: no telemetry to Umami's servers, no update checks.
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    networks: [edge, data]

  # Automated backups (story 8.4, hardened in 12.9f): a daily pg_dump, encrypted
  # to an age public key (the server cannot read it back), and a daily
  # encrypted copy of the app's S3 objects; both under backups/ in the app's
  # bucket. On-demand and restore: `just backup`, `just restore`,
  # `just restore-objects` (docs/DEPLOY.md § Backups).
  backup:
    logging: *logging
    build:
      context: ./infra/backup
    image: scs-backup:latest
    restart: unless-stopped
    environment:
      PGHOST: postgres
      # Reads everything, writes nothing (story 12.9f).
      PGUSER: scs_backup
      PGPASSWORD: ${DB_BACKUP_PASSWORD:?set DB_BACKUP_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-armurier_prod}
      # The Umami purge deletes as Umami's own role.
      UMAMI_PGPASSWORD: ${UMAMI_DB_PASSWORD}
      # aws-cli reads the standard AWS_* names; map the app's S3_* secrets.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      # Defaults to the app bucket; override BACKUP_S3_BUCKET for a separate one.
      S3_BUCKET: ${BACKUP_S3_BUCKET:-${S3_BUCKET}}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups/postgres}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-14}
      # Public key only: the private one is kept off the server (story 12.9f).
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?set BACKUP_AGE_RECIPIENT in .env}
      # Objects: the app's bucket → backups/objects/, encrypted with this passphrase.
      APP_S3_BUCKET: ${S3_BUCKET}
      BACKUP_OBJECTS_PASSWORD: ${BACKUP_OBJECTS_PASSWORD:?set BACKUP_OBJECTS_PASSWORD in .env}
      BACKUP_OBJECTS_PREFIX: ${BACKUP_OBJECTS_PREFIX:-backups/objects}
      BACKUP_OBJECTS_CRON: ${BACKUP_OBJECTS_CRON:-15 3 * * *}
      BACKUP_OBJECTS_RETENTION_DAYS: ${BACKUP_OBJECTS_RETENTION_DAYS:-30}
      # Audience data older than 25 months is deleted daily (privacy policy).
      UMAMI_PURGE_CRON: ${UMAMI_PURGE_CRON:-30 3 * * *}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    networks: [data, outbound]

  caddy:
    logging: *logging
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      # The lock in front of the Umami dashboard (story 12.9g).
      UMAMI_BASIC_AUTH_USER: ${UMAMI_BASIC_AUTH_USER:?set UMAMI_BASIC_AUTH_USER in .env}
      UMAMI_BASIC_AUTH_HASH: ${UMAMI_BASIC_AUTH_HASH:?set UMAMI_BASIC_AUTH_HASH in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Cloudflare Origin Certificate + key (docs/DEPLOY.md § 3). Kept out of git
      # (/certs/ is ignored); Caddy refuses to start without them. Long syntax so
      # a missing ./certs fails the `up` instead of Docker creating it as root.
      - type: bind
        source: ./certs
        target: /etc/caddy/certs
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data # Caddy's own state (no ACME certificates since 2026-11-14)
      - caddy_config:/config
    depends_on:
      - api
      - web
      - umami
    security_opt: ["no-new-privileges:true"]
    networks: [edge]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  clamav_data:

# Audit 2026-11-15, M3 — four networks instead of one flat one:
# - edge: what serves the site (caddy, web, api, umami), with internet access
#   (Stripe, Henrri, Brevo, S3 for the API).
# - data: Postgres and only what reads it; internal, no way out to the internet.
# - scan: the API and ClamAV, which parses hostile files: it never reaches
#   Postgres; freshclam needs the internet for the virus signatures.
# - outbound: the backup's way out to S3, nothing else on it.
networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true
  scan:
    driver: bridge
  outbound:
    driver: bridge
