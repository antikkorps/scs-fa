services:
  postgres:
    image: postgres:17-alpine
    container_name: armurier_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: armurier
      POSTGRES_PASSWORD: armurier_dev_password
      POSTGRES_DB: armurier_dev
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armurier -d armurier_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP trap. Dev must NEVER reach the real OVH relay: a smoke test that
  # ships a parcel would send a real e-mail to a real customer. Mailpit accepts
  # everything on 1025 and shows it at http://localhost:8025 — reaching the real
  # relay is now a deliberate .env edit, not the default.
  mailpit:
    image: axllent/mailpit:v1.30.2
    container_name: armurier_mailpit_dev
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
