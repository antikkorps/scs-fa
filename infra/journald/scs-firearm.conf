# journald retention for the SCS Firearms host (story 12.7a).
# Install: sudo cp infra/journald/scs-firearm.conf /etc/systemd/journald.conf.d/
#          sudo systemctl restart systemd-journald
# See docs/DEPLOY.md § Logs.
[Journal]
# Keep the journal on disk: the default can be memory-only, lost at reboot.
Storage=persistent
# Technical logs are kept 14 days, then deleted (privacy policy, RGPD register).
MaxRetentionSec=14day
# Size cap, so a burst of logs can never fill the disk; whichever limit comes first wins.
SystemMaxUse=2G
Compress=yes
