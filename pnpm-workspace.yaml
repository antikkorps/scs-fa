packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# Which dependencies may run their install scripts (native builds).
allowBuilds:
  "@node-rs/argon2": true
  "@parcel/watcher": false # ships prebuilt binaries; its script only builds from source
  "esbuild": true
  "sharp": true

# Tiptap packages move in lockstep; exceljs is held on uuid 11 (uuid 12 is ESM-only).
overrides:
  "@tiptap/core": "3.30.5"
  "@tiptap/pm": "3.30.5"
  "@tiptap/vue-3": "3.30.5"
  "@tiptap/starter-kit": "3.30.5"
  "@tiptap/extensions": "3.30.5"
  "@tiptap/extension-blockquote": "3.30.5"
  "@tiptap/extension-bold": "3.30.5"
  "@tiptap/extension-bubble-menu": "3.30.5"
  "@tiptap/extension-bullet-list": "3.30.5"
  "@tiptap/extension-code": "3.30.5"
  "@tiptap/extension-code-block": "3.30.5"
  "@tiptap/extension-document": "3.30.5"
  "@tiptap/extension-dropcursor": "3.30.5"
  "@tiptap/extension-floating-menu": "3.30.5"
  "@tiptap/extension-gapcursor": "3.30.5"
  "@tiptap/extension-hard-break": "3.30.5"
  "@tiptap/extension-heading": "3.30.5"
  "@tiptap/extension-horizontal-rule": "3.30.5"
  "@tiptap/extension-image": "3.30.5"
  "@tiptap/extension-italic": "3.30.5"
  "@tiptap/extension-link": "3.30.5"
  "@tiptap/extension-list": "3.30.5"
  "@tiptap/extension-list-item": "3.30.5"
  "@tiptap/extension-list-keymap": "3.30.5"
  "@tiptap/extension-ordered-list": "3.30.5"
  "@tiptap/extension-paragraph": "3.30.5"
  "@tiptap/extension-strike": "3.30.5"
  "@tiptap/extension-text": "3.30.5"
  "@tiptap/extension-underline": "3.30.5"
  "exceljs>uuid": "11.1.1"
  # Security fixes for transitive dependencies (story 12.9c, audit of 2026-10-21):
  # only the vulnerable versions are replaced. Drop an entry once the parent
  # package ships the fixed version itself.
  "fast-jwt@<6.3.1": "6.3.4"
  "@fastify/busboy@<3.2.1": "3.2.2"
  "prosemirror-view@<1.42.3": "1.42.3"
  "brace-expansion@>=2.0.0 <2.1.6": "2.1.7"
  "nanoid@<3.3.18": "6.0.0"
  "source-map-js@<1.2.2": "1.2.2"
  # Not a fix: unctx 3 (Nuxt 4.6) declares unplugin ^3.3.0, @nuxt/fonts settles for 3.0.
  "unplugin@>=3.0.0 <3.3.0": "3.3.0"

# `pnpm audit --prod --audit-level high` runs in CI (story 12.9c). Ignored here,
# by advisory and never by package: high advisories with NO fixed version
# published, reached only through Nuxt's build and dev server (nitropack), never
# at runtime in production. Remove each line as soon as a fix ships.
auditConfig:
  ignoreGhsas:
    # node-forge <=1.4.0, RSA PKCS#1 v1.5 signature check — via listhen (dev HTTPS certificates).
    - GHSA-86w9-cpqp-85rv
    # braces <=3.0.3, stack exhaustion on nested patterns — via globby/micromatch (build-time file globbing).
    - GHSA-vfj7-8cjw-p6xm
